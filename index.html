<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="text-scale" content="scale">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none';">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <title>Enes Turan — Platform Engineer &amp; Google Developer Expert</title>
  <meta name="description" content="Official personal profile and social links of Enes Turan — Platform Engineer at JumpCloud and Google Developer Expert based in Istanbul, Türkiye.">
  <meta name="author" content="Enes Turan">
  <meta name="theme-color" content="#060913">

  <link rel="canonical" href="https://devenes.github.io/turan-dock/">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Enes Turan">
  <meta property="og:title" content="Enes Turan — Platform Engineer &amp; Google Developer Expert">
  <meta property="og:description" content="Platform Engineer at JumpCloud and Google Developer Expert based in Istanbul, Türkiye. Connect on LinkedIn, GitHub, X, Instagram, and Facebook.">
  <meta property="og:url" content="https://devenes.github.io/turan-dock/">
  <meta property="og:image" content="https://devenes.github.io/turan-dock/assets/images/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Enes Turan — Platform Engineer at JumpCloud and Google Developer Expert">

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@thedevenes">
  <meta name="twitter:creator" content="@thedevenes">
  <meta name="twitter:title" content="Enes Turan — Platform Engineer &amp; Google Developer Expert">
  <meta name="twitter:description" content="Platform Engineer at JumpCloud and Google Developer Expert based in Istanbul, Türkiye.">
  <meta name="twitter:image" content="https://devenes.github.io/turan-dock/assets/images/og-image.png">
  <meta name="twitter:image:alt" content="Enes Turan — Platform Engineer at JumpCloud and Google Developer Expert">

  <link rel="stylesheet" href="./assets/css/style.css">
  <script type="module" src="./assets/js/main.js"></script>
</head>
<body>
  <!-- Decorative Midnight Aurora ambient background -->
  <div class="aurora-bg" aria-hidden="true">
    <div class="aurora-orb aurora-orb--teal"></div>
    <div class="aurora-orb aurora-orb--blue"></div>
    <div class="aurora-orb aurora-orb--violet"></div>
    <div class="aurora-grain"></div>
  </div>

  <div class="page-shell">
    <main class="profile-main" id="main-content">
      <section class="profile-header" aria-labelledby="profile-name">
        <div class="avatar-frame" id="avatar-frame">
          <div class="avatar-ring" aria-hidden="true"></div>
          <img
            id="profile-avatar"
            class="profile-avatar"
            src="./assets/images/profile.webp"
            alt="Enes Turan speaking on stage"
            width="116"
            height="116"
            fetchpriority="high"
          >
        </div>

        <h1 id="profile-name" class="profile-name">Enes Turan</h1>

        <p id="profile-headline" class="profile-headline">Platform Engineer at JumpCloud</p>

        <div id="profile-badges" class="profile-badges"></div>

        <p id="profile-location" class="profile-location" hidden></p>

        <p id="profile-description" class="profile-description" hidden></p>
      </section>

      <nav class="links-nav" aria-label="Social and professional links">
        <ul id="links-list" class="links-list"></ul>
        <noscript>
          <p class="noscript-notice">Please enable JavaScript to view social and profile links.</p>
        </noscript>
      </nav>
    </main>

    <footer id="site-footer" class="site-footer"></footer>
  </div>
</body>
</html>
